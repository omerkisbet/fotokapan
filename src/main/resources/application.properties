spring.application.name=wildlife-media-service

server.port=${PORT:8081}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wildlife_media}

app.media.storage-path=${MEDIA_STORAGE_PATH:media-storage}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.bootstrap.admin-email=${APP_ADMIN_EMAIL:admin@wildlife.local}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:Admin123!}
app.bootstrap.customer-email=${APP_CUSTOMER_EMAIL:customer@wildlife.local}
app.bootstrap.customer-password=${APP_CUSTOMER_PASSWORD:Customer123!}
